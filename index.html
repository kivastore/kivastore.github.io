<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiva's Store</title>
<style>
:root{--ink:#1b1030;--pur:#6b3fd4;--dpur:#4b2a9b;--pink:#e63c85;--blush:#fde7f1;--lav:#f1eafe;--line:#eadcf7;--mut:#6d6283}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#fff}
h1,h2,h3{font-family:'Avenir Next','Trebuchet MS',system-ui,sans-serif;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer}a{color:inherit}
:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;font-size:14px}
.bar b{margin-right:auto}.bar button{background:#fff2;color:#fff;border:1px solid #fff4;border-radius:99px;padding:6px 14px}
.bar button.go{background:var(--pink);border-color:var(--pink)}
.hero{background:linear-gradient(135deg,var(--lav),var(--blush));padding:32px 20px 40px}
.hw{max-width:1000px;margin:auto;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.logo{width:48px;height:48px;flex:none;border-radius:50%;background:#fff;border:2px solid var(--pink);display:grid;place-items:center;overflow:hidden;font:800 24px 'Avenir Next','Trebuchet MS',system-ui,sans-serif;color:var(--pink)}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}.top b{font:800 20px 'Avenir Next','Trebuchet MS',system-ui,sans-serif}
.sr{display:grid;grid-template-columns:116px 1fr 38px;gap:6px}.sr button{border:1px solid var(--line);background:#fff;border-radius:10px;color:#b4143c}.fb .btn{justify-self:start}
.logo img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:clamp(36px,6vw,60px);font-weight:800;color:var(--ink)}
.tag1{font:600 20px 'Avenir Next','Trebuchet MS',system-ui,sans-serif;color:var(--pur);margin:8px 0 12px}
.bio{color:var(--mut);max-width:44ch;white-space:pre-line}
.soc{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.soc a{text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-weight:700;font-size:14px;color:var(--dpur)}
.soc a:hover{background:var(--ink);color:#fff}
.ph{position:relative;justify-self:center;width:min(100%,330px)}
.ph:before{content:"";position:absolute;inset:14px -14px -14px 14px;background:var(--pur);border-radius:170px 170px 24px 24px;opacity:.9}
.ph img{position:relative;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:45% 15%;border-radius:170px 170px 24px 24px;border:4px solid #fff;display:block;background:var(--blush)}
main{max-width:1000px;margin:auto;padding:28px 16px 40px}
.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:99px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:#fff;padding:7px 20px;font-weight:700}
.seg button.on{background:var(--pink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chips button{flex:none;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 16px;color:var(--dpur);font-weight:500}
.chips button.on{background:var(--pur);border-color:var(--pur);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card .im{display:block;aspect-ratio:1;background:var(--lav)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.ct{font-size:12px;font-weight:700;color:var(--pink)}
.cb h3{font-size:18px}.cb p{margin:0;font-size:14px;color:var(--mut);flex:1}
.buy{display:block;text-align:center;text-decoration:none;background:var(--pink);color:#fff;font-weight:700;padding:10px;border-radius:12px;margin-top:6px}
.buy:hover{background:var(--ink)}
.ad{display:flex;gap:6px;margin-top:6px}.ad button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px}
.ad button.del{color:#b4143c}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
footer{background:var(--ink);color:#d9cdf3;text-align:center;padding:28px 20px;font-size:14px}
footer p{max-width:60ch;margin:0 auto 10px}footer button{background:none;border:0;color:#a994d8;text-decoration:underline}
.modal{position:fixed;inset:0;background:#1b1030aa;z-index:50;display:grid;place-items:center;padding:12px}
.sheet{background:#fff;border-radius:20px;padding:20px;width:min(520px,100%);max-height:92vh;overflow:auto}
.sheet h2{margin-bottom:12px}.fb{display:grid;gap:10px}
.fb label{display:grid;gap:4px;font-weight:700;font-size:14px}
.fb input,.fb select,.fb textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;width:100%}
.fb small{color:var(--mut);font-weight:400}.fb img{max-height:90px;border-radius:10px;justify-self:start}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 20px;font-weight:700}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#fff}
@media(max-width:720px){.hw{grid-template-columns:1fr}.ph{order:-1;width:min(70%,260px)}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.cb{padding:10px}.cb h3{font-size:16px}}
.sec{font-size:26px;margin:0 0 14px}.bsec{margin-bottom:34px}
.bun{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:18px;background:#fff}
.bun.noimg{grid-template-columns:1fr}.bun.noimg .bb{padding:18px}
.bim{background:var(--lav)}.bim img{width:100%;height:100%;max-height:560px;object-fit:contain;display:block}
.bb{padding:18px 18px 18px 0;display:flex;flex-direction:column;gap:8px}.bb h3{font-size:24px}
.bd{margin:0;color:var(--mut)}.bs{margin:0;font-size:13px;font-weight:700;color:var(--dpur)}
.bl{display:grid;gap:8px;margin-top:4px}
.bi{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bi b{display:block}.bi small{display:block;color:var(--mut)}
.buy.sm{margin:0;padding:8px 14px;white-space:nowrap;font-size:14px}.soon{font-size:13px;color:var(--mut);text-align:right}
.ir{display:grid;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--lav)}.irh{display:flex;gap:6px}.irh select{flex:1}
.cr{grid-template-columns:64px 1fr 84px 38px}
@media(max-width:720px){.bun{grid-template-columns:1fr}.bb,.bun.noimg .bb{padding:0 14px 16px}.bun.noimg .bb{padding-top:16px}.bim img{max-height:420px}}
.top .wl{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;color:var(--dpur)}
.card{position:relative}
.hrt{border:1px solid var(--line);background:#fff;color:var(--pink);width:38px;height:38px;border-radius:50%;font-size:20px;line-height:1;display:grid;place-items:center;padding:0;flex:none}
.hrt.on{background:var(--pink);border-color:var(--pink);color:#fff}
.card>.hrt{position:absolute;top:10px;right:10px;z-index:2;box-shadow:0 2px 8px #1b103033}
.hrt.sm{width:34px;height:34px;font-size:18px}
.bh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.ba{display:flex;gap:8px;align-items:center}
.wlist{display:grid;gap:8px;margin:10px 0}
.wr{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px}
.wr img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none;background:var(--lav)}
.wr>div{flex:1;min-width:0}.wr b{display:block}.wr small{display:block;color:var(--mut)}
.shared{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--lav);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:18px;font-weight:700;color:var(--dpur)}
.only .hero,.only .filters,.only .sec,.only .empty{display:none}
.card>.shr{right:56px}.hrt.shr{color:var(--dpur)}
.hl{outline:3px solid var(--pink);outline-offset:3px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:60;font-size:14px}
.pg{min-width:0}
.side{position:fixed;top:0;left:0;bottom:0;width:250px;background:#fff;border-right:1px solid var(--line);z-index:40;padding:18px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.sb{display:flex;align-items:center;gap:10px;margin:0 6px 16px}.sb b{font:800 20px 'Avenir Next','Trebuchet MS',system-ui,sans-serif}
.sn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:12px;padding:11px 14px;font-weight:600;color:var(--ink);text-align:left}
.sn:hover{background:var(--lav)}.sn.on{background:linear-gradient(135deg,var(--pur),var(--dpur));color:#fff}
.sn svg{width:20px;height:20px;flex:none}
.sn .cnt{margin-left:auto;background:var(--pink);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 9px}
.sn .chev{margin-left:auto;font-size:18px;line-height:1}.sn.open .chev{transform:rotate(90deg)}
.sub{display:grid;gap:2px;margin:2px 0 8px 22px;padding-left:10px;border-left:2px solid var(--line)}
.sub button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:10px;color:var(--mut)}
.sub button:hover{background:var(--lav)}.sub button.on{background:var(--lav);color:var(--dpur);font-weight:700}
.mb{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;font-size:20px;line-height:1;flex:none}
.scrim{display:none}
@media(min-width:901px){.pg{margin-left:250px}.top{display:none}}
@media(max-width:900px){.mb{display:block}.side{transform:translateX(-100%);transition:transform .25s;box-shadow:6px 0 24px #1b103033}.side.open{transform:none}.scrim.show{display:block;position:fixed;inset:0;background:#1b103066;z-index:35}}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
.sg{font-weight:800;color:var(--ink);font-size:14px;padding:10px 10px 2px}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.gt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 10px;border:2px solid var(--line);background:linear-gradient(135deg,var(--lav),var(--blush));border-radius:18px;color:var(--ink)}
.gt span{font-size:28px;line-height:1.2}.gt b{font:800 18px 'Avenir Next','Trebuchet MS',system-ui,sans-serif}.gt small{color:var(--mut)}
.gt.on{background:var(--pink);border-color:var(--pink);color:#fff}.gt.on small{color:#fff}
.gh{margin:-6px 0 14px;color:var(--mut);font-size:14px}
.imw{position:relative}
.sl{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.sl::-webkit-scrollbar{display:none}
.sl img{flex:none;width:100%;scroll-snap-align:center}
.sa{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:#ffffffd9;color:var(--ink);font-size:20px;line-height:1;padding:0;box-shadow:0 2px 6px #1b103033}
.sa.prev{left:8px}.sa.next{right:8px}
.cn{position:absolute;left:10px;bottom:10px;background:#1b1030b3;color:#fff;border-radius:99px;font-size:12px;padding:2px 9px;pointer-events:none}
.gal{display:flex;gap:10px;flex-wrap:wrap}.gi{position:relative}.gi img{height:80px;width:auto;max-height:80px}
.gi button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#fff;padding:0;font-size:12px;line-height:1}
.gi small{position:absolute;left:4px;bottom:4px;background:#1b1030b3;color:#fff;border-radius:99px;padding:0 7px;font-size:11px}
.gr{display:grid;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px}.gr img{max-height:90px}
.gt.cv{background-size:cover;background-position:center;aspect-ratio:4/5;justify-content:flex-end;border-color:var(--line)}
.gt.cv b,.gt.cv small{color:#fff;text-shadow:0 1px 4px #0007}.gt.cv.on{box-shadow:0 0 0 3px var(--pink);border-color:var(--pink)}
.gw{position:relative;display:flex}.gw .gt{width:100%}
.gcv{position:absolute;top:8px;left:8px;z-index:2;border:0;background:#ffffffe6;color:var(--dpur);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;box-shadow:0 2px 6px #1b103033}
.bts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.btb{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:0 0 10px;overflow:hidden;color:var(--ink)}
.bti{position:relative;display:block;aspect-ratio:3/4;background:var(--lav);overflow:hidden}.bti img{width:100%;height:100%;object-fit:cover;display:block}
.bti i{display:grid;place-items:center;height:100%;font-size:44px;font-style:normal}
.bti em{position:absolute;right:8px;bottom:8px;background:#1b1030b3;color:#fff;border-radius:99px;font-size:12px;font-style:normal;padding:2px 9px}
.btb b{padding:0 10px;font-size:15px;line-height:1.25}.btb small{padding:0 10px;color:var(--pink);font-weight:700;font-size:12px}
.bt{display:flex;flex-direction:column}.btb{flex:1}.bt .ad{margin-top:6px}.bk{margin-bottom:12px}

<label>Outfit pictures (collage) <small>add 2 or more, up to 5. The first one is the main picture</small><input name="f" type="file" accept="image/*" multiple></label><div id="gal" class="gal"></div>${F('Or paste an image link','iu','')}
<div><b>Items in this outfit</b> <small>One row per product. Each row has its own category and link.</small></div><div id="il" style="display:grid;gap:10px">${b.items.map(x=>ir(x,b.g||'Women')).join('')}</div><button type="button" class="btn" data-ai>+ Add item</button><datalist id="stl">${ST.map(x=>`<option value="${x}">`).join('')}</datalist>`,m=>{
const t=V(m,'t');if(!t){alert('Add a bundle title');return false}
const items=[...m.querySelectorAll('.ir')].map(r=>{const g=k=>r.querySelector(`[name=${k}]`).value.trim();return{id:r.dataset.id||'i'+Date.now()+Math.random().toString(36).slice(2,5),c:g('ic'),t:g('it'),u:g('ul'),s:g('is'),d:g('idn')}}).filter(x=>x.t);
if(!items.length){alert('Add at least one item with a name');return false}
if(items.some(x=>x.u&&!/^https?:\/\//i.test(x.u))){alert('Item links must start with https://');return false}
const L=[...imgs],lk=V(m,'iu');if(lk&&!L.includes(lk))L.push(lk);const gn=V(m,'bn')||V(m,'bc')||'Other';if(!D.bcats.includes(gn)&&gn!=='Other')D.bcats.push(gn);const o={id:b.id||'b'+Date.now(),t,g:V(m,'bg'),bc:gn,d:V(m,'d'),i:L[0]||'',x:L.slice(1,5),items};
if(n)D.bundles.unshift(o);else D.bundles[D.bundles.findIndex(x=>x.id===b.id)]=o;openB=o.bc;save();render()});
gal(m,700);
m.addEventListener('click',e=>{const t=e.target;if('ri' in t.dataset)t.closest('.ir').remove();else if('ai' in t.dataset)m.querySelector('#il').insertAdjacentHTML('beforeend',ir(NI(),m.querySelector('[name=bg]').value))});m.querySelector('[name=bg]').onchange=e=>{m.querySelectorAll('.ir [name=ic]').forEach(c=>{const cur=c.value,l=catsFor(e.target.value);c.innerHTML=opts(l,l.includes(cur)?cur:'')})}}
const wrow=id=>{const f=find(id);if(!f)return'';
if(f.k==='b')return `<div class="wr">${f.b.i?`<img src="${esc(f.b.i)}" alt="">`:''}<div><span class="ct">Outfit bundle</span><b>${esc(f.b.t)}</b><small>${f.b.items.length} items</small></div><button type="button" class="btn" data-a="vb" data-v="${esc(f.b.id)}">View</button>${heart(id,'sm')}</div>`;
const p=f.p;return `<div class="wr"><img src="${esc(p.i||(f.b&&f.b.i)||ph(p))}" alt=""><div><span class="ct">${ic(p.c)}${esc(p.c)}</span><b>${esc(p.t)}</b>${f.b?`<small>From ${esc(f.b.t)}</small>`:''}</div>${buyBtn(p,'Buy')}${heart(id,'sm')}</div>`};
function wl(){const m=document.createElement('div');m.className='modal';
const draw=()=>{const r=W.map(wrow).join('');m.innerHTML=`<div class="sheet"><h2>♥ Saved for later</h2><small>Saved on this phone or browser only.</small><div class="wlist">${r||'<div class="empty">Nothing saved yet. Tap the ♡ on any product or outfit to save it here.</div>'}</div><div class="row"><button class="btn" data-x>Close</button></div></div>`};
draw();document.body.appendChild(m);
m.onclick=e=>{if(e.target===m||e.target.hasAttribute('data-x')){m.remove();return}const t=e.target.closest('[data-a]');if(!t)return;
if(t.dataset.a==='w'){tog(t.dataset.v);draw();render()}else if(t.dataset.a==='vb'){m.remove();const f0=find(t.dataset.v);if(only)clr();if(f0&&f0.k==='b'){openB=f0.b.bc;openBun=f0.b.id}render();const el=document.getElementById(t.dataset.v);if(el)el.scrollIntoView({behavior:'smooth'})}}}
const cr=c=>`<div class="sr cr"><input name="ci" value="${esc(D.icons[c]||'')}" placeholder="🙂" maxlength="4" aria-label="Icon"><input name="cn" value="${esc(c)}" data-old="${esc(c)}" placeholder="Category name" aria-label="Category name"><select name="cg" aria-label="For">${['Women','Men','Both'].map(g=>`<option ${g===cgOf(c)?'selected':''}>${g}</option>`).join('')}</select><button type="button" title="Remove category" data-rc>−</button></div>`;
function cats(){const m=modal('Categories',`<div><small>Tap + to add a category and − to remove one. Pick Women, Men or Both for each, and add an icon (emoji) if you like. Products in a removed category stay listed under All.</small></div><div id="cl" style="display:grid;gap:6px">${D.cats.map(cr).join('')}</div><button type="button" class="btn" data-ac>+ Add category</button>`,m=>{
const rows=[...m.querySelectorAll('.cr')].map(r=>({o:r.querySelector('[name=cn]').dataset.old,n:r.querySelector('[name=cn]').value.trim(),i:r.querySelector('[name=ci]').value.trim(),g:r.querySelector('[name=cg]').value})).filter(r=>r.n),icons={},cg={};
rows.forEach(r=>{cg[r.n]=r.g;if(r.i)icons[r.n]=r.i;if(r.o&&r.o!==r.n){D.products.forEach(p=>{if(p.c===r.o)p.c=r.n});D.bundles.forEach(b=>b.items.forEach(x=>{if(x.c===r.o)x.c=r.n}))}});
D.cats=[...new Set(rows.map(r=>r.n))];D.icons=icons;D.cg=cg;if(cat!=='all'&&!D.cats.includes(cat))cat='all';save();render()});
m.addEventListener('click',e=>{const t=e.target;if('rc' in t.dataset)t.closest('.cr').remove();else if('ac' in t.dataset)m.querySelector('#cl').insertAdjacentHTML('beforeend',cr(''))})}
function bgroups(){const cv={...(D.bcov||{})},del=new Set();
const row=g=>`<div class="gr" data-g="${esc(g)}"><b>${esc(g)}</b><img alt="Cover" ${cv[g]?`src="${esc(cv[g])}"`:'hidden'}><input type="file" accept="image/*" aria-label="Cover picture for ${esc(g)}"><div class="row" style="margin:0;justify-content:flex-start"><button type="button" class="btn" data-rc>Remove cover</button>${D.bundles.some(b=>b.bc===g)?'':'<button type="button" class="btn" data-dg>Delete group</button>'}</div></div>`;
const m=modal('Bundle groups',`<small>Add a cover picture to each group. It shows on the group's tile for visitors. Empty groups can be deleted.</small>${bnames().map(row).join('')}`,()=>{D.bcov=cv;del.forEach(g=>{D.bcats=D.bcats.filter(x=>x!==g);delete D.bcov[g]});if(del.has(openB))openB='';save();render()});
m.addEventListener('change',e=>{const r=e.target.closest('.gr');if(!r||!e.target.files||!e.target.files[0])return;shrink(e.target.files[0],600,u=>{cv[r.dataset.g]=u;const p=r.querySelector('img');p.src=u;p.hidden=false})});
m.addEventListener('click',e=>{const r=e.target.closest('.gr');if(!r)return;if('rc' in e.target.dataset){delete cv[r.dataset.g];r.querySelector('img').hidden=true}else if('dg' in e.target.dataset){del.add(r.dataset.g);r.remove()}})}
function exp(){D.ts=Date.now();save();const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelectorAll('.modal').forEach(x=>x.remove());c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'}));a.download='index.html';a.click()}
$('#app').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==='c'){cat=v;render()}else if(a==='g'){gen=v;if(cat!=='all'&&!vis().includes(cat))cat='all';render()}
else if(a==='bo'||a==='bb'){openBun=a==='bo'?v:'';render();const el=$('#bgl');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}else if(a==='gcov'){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(f)shrink(f,600,u=>{D.bcov[v]=u;save();render()})};i.click()}else if(a==='bn'){bunOpen=!bunOpen;render()}else if(a==='bsg'){setMenu(false);clr();gen='all';cat='all';openB=v;openBun='';render();const el=document.getElementById('bundles');if(el)el.scrollIntoView({behavior:'smooth'})}else if(a==='sl'){const w=b.parentElement.querySelector('.sl');if(w)w.scrollBy({left:+b.dataset.d*w.clientWidth,behavior:'smooth'})}else if(a==='bgs')bgroups();else if(a==='bgrp'){openB=openB===v?'':v;openBun='';render();const el=$('#bgl');if(el&&openB)el.scrollIntoView({behavior:'smooth',block:'nearest'})}else if(a==='stats')stats();else if(a==='sh')share(v);else if(a==='all'){clr();render();window.scrollTo(0,0)}
else if(a==='w'){tog(v);render()}else if(a==='wl'){setMenu(false);wl()}
else if(a==='menu')setMenu(!menuOpen);else if(a==='ct'){catOpen=!catOpen;render()}
else if(a==='home'){setMenu(false);clr();cat='all';gen='all';render();window.scrollTo(0,0)}
else if(a==='sc'){setMenu(false);clr();gen=b.dataset.g||'all';cat=v;render();const f=document.querySelector('.filters');if(f&&f.scrollIntoView)f.scrollIntoView({behavior:'smooth'})}
else if(a==='in'){const p=prompt('Owner passcode');if(p===D.pass){admin=true;try{localStorage.setItem('kiva_owner','1')}catch(e){}render()}else if(p!==null)alert('Wrong passcode')}
else if(a==='out'){admin=false;render()}else if(a==='add')prod();else if(a==='edit')prod(D.products.find(x=>x.id===v));
else if(a==='del'){if(confirm('Delete this product?')){D.products=D.products.filter(x=>x.id!==v);save();render()}}
else if(a==='addb')bund();else if(a==='eb')bund(D.bundles.find(x=>x.id===v));
else if(a==='db'){if(confirm('Delete this outfit bundle?')){D.bundles=D.bundles.filter(x=>x.id!==v);save();render()}}
else if(a==='prof')prof();else if(a==='cats')cats();else if(a==='exp')exp()};
$('#app').addEventListener('scroll',e=>{const t=e.target;if(t.classList&&t.classList.contains('sl')){const c=t.closest('.imw').querySelector('.cn');if(c)c.textContent=(Math.round(t.scrollLeft/t.clientWidth)+1)+'/'+t.children.length}},true);
document.title=D.brand;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen)setMenu(false)});window.addEventListener('hashchange',goHash);if(location.hash)goHash();else render();boot();
</script>
</body></html>
