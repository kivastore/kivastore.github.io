<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Fashion Picks</title>
<meta name="description" content="My favourite fashion finds and useful products, all in one place.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
<style>
:root{--pink:#ff4fa3;--pink-soft:#ffd6ea;--purple:#7b2ff7;--purple-soft:#ebdcff;--ink:#16101f;--white:#fff;--muted:#6d6380}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;
 background:linear-gradient(160deg,#ffe3f1 0%,#f1e4ff 55%,#e3d2ff 100%) fixed;padding:28px 16px 40px}
.wrap{max-width:480px;margin:0 auto}
.head{text-align:center;margin-bottom:26px}
.ring{width:112px;height:112px;border-radius:50%;margin:0 auto 14px;padding:4px;background:linear-gradient(135deg,var(--pink),var(--purple))}
.ring img,.ring .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--white);display:grid;place-items:center;font-size:40px;border:3px solid var(--white)}
h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.bio{margin:8px auto 0;max-width:34ch;color:var(--muted);font-size:15px;line-height:1.5;white-space:pre-line}
.list{display:grid;gap:12px}
.card{display:flex;align-items:center;gap:14px;background:var(--white);border:2px solid var(--ink);border-radius:18px;padding:10px;text-decoration:none;color:inherit;
 box-shadow:4px 4px 0 var(--purple);transition:transform .15s,box-shadow .15s}
a.card:hover,a.card:focus-visible{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--pink);outline:none}
.thumb{flex:none;width:68px;height:68px;border-radius:12px;background:var(--pink-soft);object-fit:cover;display:grid;place-items:center;font-size:26px;overflow:hidden}
.txt{min-width:0;flex:1}
.ttl{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.tag{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;color:var(--purple);background:var(--purple-soft);padding:2px 9px;border-radius:99px}
.go{flex:none;background:var(--ink);color:var(--white);font-weight:700;font-size:13px;padding:9px 14px;border-radius:99px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.foot{margin-top:30px;text-align:center;font-size:12px;color:var(--muted);line-height:1.5}
.foot button{background:none;border:0;color:var(--purple);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;justify-content:center}
.chip{font:inherit;font-weight:700;font-size:13px;border:2px solid var(--ink);background:var(--white);color:var(--ink);border-radius:99px;padding:6px 13px;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--pink),var(--purple));color:var(--white)}
.chip:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.sec{font-family:Georgia,"Times New Roman",serif;font-size:21px;margin:16px 0 0}
.sec:first-child{margin-top:0}
.mgr{background:var(--white);border:2px dashed var(--purple);border-radius:16px;padding:12px;margin-bottom:16px}
.mgr b{font-size:14px}
.crow{display:flex;gap:8px;align-items:center}
.crow .b{flex:none;margin-top:6px}
/* owner mode */
.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--white);border-radius:16px;padding:10px;margin:-12px 0 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar b{flex:1 1 100%;font-size:13px}
button.b{font:inherit;font-weight:700;font-size:13px;border:0;border-radius:99px;padding:9px 14px;cursor:pointer;color:var(--white);background:linear-gradient(135deg,var(--pink),var(--purple))}
button.b.alt{background:#fff;color:var(--ink)}
button.b.ghost{background:transparent;border:1px solid #fff}
.ed{display:block;width:100%;font:inherit;font-size:14px;border:1.5px solid #cdbfe6;border-radius:10px;padding:8px 10px;margin-top:6px;background:#fff;color:var(--ink)}
.ed:focus{outline:2px solid var(--pink);border-color:var(--pink)}
.card.e{align-items:flex-start;box-shadow:4px 4px 0 var(--pink)}
.up{display:block;cursor:pointer;text-align:center}
.up span{display:block;font-size:11px;font-weight:700;color:var(--purple);margin-top:4px}
.up input{display:none}
.ctl{display:flex;gap:6px;margin-top:8px}
.ctl button{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
.ctl .del{margin-left:auto;color:#c0123f;border-color:#c0123f}
.ph-hint{font-size:12px;color:var(--muted);margin-top:4px}
dialog{border:2px solid var(--ink);border-radius:18px;padding:20px;max-width:340px;width:calc(100% - 32px);box-shadow:6px 6px 0 var(--purple)}
dialog::backdrop{background:rgba(22,16,31,.55)}
dialog p{font-size:14px;line-height:1.5;color:var(--muted);margin-top:4px}
.msg{color:#c0123f;font-size:13px;margin-top:6px;min-height:1em}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>

function draft(){try{localStorage.setItem('lbp_draft',JSON.stringify(D))}catch(e){}}
function hash(s){
  if(window.crypto&&crypto.subtle){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('lbp:'+s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
  var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Promise.resolve('x'+h)
}
function shrink(file,max,type,cb){
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    var x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
    x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(type,.82))};im.src=r.result};r.readAsDataURL(file)
}
function thumb(l){return l.img?'<img class="thumb" src="'+attr(l.img)+'" alt="'+attr(l.title)+'" loading="lazy">':'<div class="thumb">🛍️</div>'}
function header(){
  var logo=D.logo?'<img src="'+attr(D.logo)+'" alt="'+attr(D.name)+' logo">':'<div class="ph">💖</div>';
  if(!owner)return '<div class="head"><div class="ring">'+logo+'</div><h1>'+esc(D.name)+'</h1><p class="bio">'+esc(D.bio)+'</p></div>';
  return '<div class="head"><div class="ring">'+logo+'</div>'+
  '<label class="up"><input type="file" accept="image/*" data-logo><span>Change logo / photo</span></label>'+
  '<input class="ed" data-f="name" value="'+attr(D.name)+'" placeholder="Your name" style="text-align:center;font-weight:700;font-size:18px">'+
  '<textarea class="ed" data-f="bio" rows="3" placeholder="Your bio">'+esc(D.bio)+'</textarea></div>'
}
var cur='All';
function visIdx(){var v=[];D.links.forEach(function(l,i){if(cur==='All'||l.cat===cur)v.push(i)});return v}
function cardHtml(l,i){
  if(!owner)return '<a class="card" href="'+attr(fixUrl(l.url))+'" target="_blank" rel="noopener noreferrer sponsored">'+thumb(l)+
    '<div class="txt"><div class="ttl">'+esc(l.title)+'</div>'+(l.tag?'<span class="tag">'+esc(l.tag)+'</span>':'')+'</div><span class="go">Shop</span></a>';
  var opts='<option value="">Section: none</option>'+D.cats.map(function(c){return '<option value="'+attr(c)+'"'+(c===l.cat?' selected':'')+'>'+esc(c)+'</option>'}).join('');
  return '<div class="card e"><label class="up">'+thumb(l)+'<input type="file" accept="image/*" data-img="'+i+'"><span>Photo</span></label>'+
    '<div class="txt"><input class="ed" data-i="'+i+'" data-k="title" value="'+attr(l.title)+'" placeholder="Product name" style="margin-top:0">'+
    '<input class="ed" data-i="'+i+'" data-k="url" value="'+attr(l.url)+'" placeholder="Affiliate link (https://…)" inputmode="url">'+
    '<input class="ed" data-i="'+i+'" data-k="tag" value="'+attr(l.tag)+'" placeholder="Small label (optional)">'+
    '<select class="ed" data-i="'+i+'" data-k="cat">'+opts+'</select>'+
    '<div class="ctl"><button data-up="'+i+'" aria-label="Move up">↑</button><button data-dn="'+i+'" aria-label="Move down">↓</button><button class="del" data-del="'+i+'">Delete</button></div></div></div>'
}
function cards(){
  var idx=visIdx();
  if(!idx.length)return '<p class="empty">No links here yet.'+(owner?' Tap “Add link” above.':'')+'</p>';
  if(owner||cur!=='All')return idx.map(function(i){return cardHtml(D.links[i],i)}).join('');
  var out='';
  D.cats.concat(['']).forEach(function(g){
    var m=idx.filter(function(i){var c=D.cats.indexOf(D.links[i].cat)>=0?D.links[i].cat:'';return c===g});
    if(m.length)out+='<h2 class="sec">'+esc(g||'More picks')+'</h2>'+m.map(function(i){return cardHtml(D.links[i],i)}).join('')
  });
  return out
}
function chips(){
  var n=['All'].concat(D.cats.filter(function(c){return owner||D.links.some(function(l){return l.cat===c})}));
  if(n.length<2)return '';
  return '<div class="chips">'+n.map(function(c){return '<button class="chip'+(c===cur?' on':'')+'" data-cur="'+attr(c)+'">'+esc(c)+'</button>'}).join('')+'</div>'
}
function catMgr(){
  return '<div class="mgr"><b>Your sections (rename, delete or add)</b>'+D.cats.map(function(c,i){return '<div class="crow"><input class="ed" data-c="'+i+'" value="'+attr(c)+'"><button class="b alt" data-cdel="'+i+'">Delete</button></div>'}).join('')+
    '<div class="crow"><input class="ed" id="newcat" placeholder="New section name"><button class="b" data-cadd>Add</button></div></div>'
}
function render(){
  if(!D.cats)D.cats=[];if(cur!=='All'&&D.cats.indexOf(cur)<0)cur='All';
  var bar=owner?'<div class="bar"><b>Owner mode: only you see this</b><button class="b" data-add>+ Add link</button><button class="b alt" data-dl>Download website</button><button class="b ghost" data-exit>Exit</button></div>':'';
  var foot='<div class="foot">'+(owner?'<textarea class="ed" data-f="disclosure" rows="2">'+esc(D.disclosure)+'</textarea>':'<p>'+esc(D.disclosure)+'</p>')+
    (owner?'<p class="ph-hint">Edits save in this browser. Tap “Download website”, then upload the new file to your host to make them live.</p>':'<button data-login>Owner login</button>')+'</div>';
  app.innerHTML='<div class="wrap" style="padding:0">'+bar+header()+(owner?catMgr():'')+chips()+'<div class="list">'+cards()+'</div>'+foot+'</div>';
  document.title=D.name+' | Links';
}
function dialog(html,onSubmit){
  dlg.innerHTML='<form method="dialog" id="f">'+html+'<p class="msg" id="m"></p><div class="ctl" style="margin-top:12px"><button class="b" value="ok">Continue</button><button class="b alt" value="x" formnovalidate>Cancel</button></div></form>';
  dlg.showModal();
  document.getElementById('f').onsubmit=function(e){if(e.submitter&&e.submitter.value==='x')return;e.preventDefault();onSubmit(function(m){document.getElementById('m').textContent=m})}
}
function login(){
  if(!D.pw){
    dialog('<h2>Create your owner password</h2><p>You’ll need it each time you edit. Keep it safe.</p><input class="ed" id="p1" type="password" placeholder="New password (6+ characters)"><input class="ed" id="p2" type="password" placeholder="Repeat password">',function(err){
      var a=p1.value,b=p2.value;if(a.length<6)return err('Use at least 6 characters.');if(a!==b)return err('Passwords don’t match.');
      hash(a).then(function(h){D.pw=h;enter()})})
  }else{
    dialog('<h2>Owner login</h2><input class="ed" id="p1" type="password" placeholder="Password">',function(err){
      hash(p1.value).then(function(h){h===D.pw?enter():err('Wrong password.')})})
  }
}
function enter(){
  dlg.close();owner=true;
  try{var s=localStorage.getItem('lbp_draft');if(s){var d=JSON.parse(s);if(d&&d.pw===D.pw)D=d}}catch(e){}
  draft();render();window.scrollTo(0,0)
}
function download(){
  TEMPLATE.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
  var html='<!DOCTYPE html>\n'+TEMPLATE.outerHTML,a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove()
}
app.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;var ds=t.dataset;
  if(ds.cur!=null){cur=ds.cur;return render()}
  if('cadd' in ds){var nc=document.getElementById('newcat').value.trim();if(nc&&D.cats.indexOf(nc)<0){D.cats.push(nc);draft();render()}return}
  if(ds.cdel!=null){var o=D.cats[+ds.cdel];if(!confirm('Delete the section “'+o+'”? Its links stay, under “More picks”.'))return;D.cats.splice(+ds.cdel,1);D.links.forEach(function(l){if(l.cat===o)l.cat=''});draft();return render()}
  if('login' in ds)return login();
  if('exit' in ds){owner=false;return render()}
  if('dl' in ds)return download();
  if('add' in ds){D.links.unshift({title:'',url:'',tag:'',img:'',cat:D.cats.indexOf(cur)>=0?cur:''});draft();render();var f=app.querySelector('[data-k=title]');if(f)f.focus();return}
  var i=ds.up!=null?+ds.up:ds.dn!=null?+ds.dn:ds.del!=null?+ds.del:null;if(i==null)return;
  if(ds.del!=null){if(!confirm('Delete this link?'))return;D.links.splice(i,1)}
  else{var v=visIdx(),p=v.indexOf(i),q=ds.up!=null?p-1:p+1;if(q<0||q>=v.length)return;var j=v[q],x=D.links[i];D.links[i]=D.links[j];D.links[j]=x}
  draft();render()
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.f){D[t.dataset.f]=t.value}
  else if(t.dataset.k){D.links[+t.dataset.i][t.dataset.k]=t.value}
  else return;draft()
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.c!=null){var i=+t.dataset.c,o=D.cats[i],n=t.value.trim();if(!n||(D.cats.indexOf(n)>=0&&n!==o)){t.value=o;return}
    D.links.forEach(function(l){if(l.cat===o)l.cat=n});D.cats[i]=n;if(cur===o)cur=n;draft();return render()}
  var f=t.files&&t.files[0];if(!f)return;
  if(t.hasAttribute('data-logo'))shrink(f,320,'image/png',function(u){D.logo=u;draft();render()});
  else if(t.dataset.img!=null)shrink(f,420,'image/jpeg',function(u){D.links[+t.dataset.img].img=u;draft();render()})
});
render();
})();
</script></body></html>
