<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiva's Store</title>
<style>
:root{--ink:#1b1030;--pur:#6b3fd4;--dpur:#4b2a9b;--pink:#e63c85;--blush:#fde7f1;--lav:#f1eafe;--line:#eadcf7;--mut:#6d6283}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#fff}
h1,h2,h3{font-family:'Avenir Next','Trebuchet MS',system-ui,sans-serif;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer}a{color:inherit}
:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;font-size:14px}
.bar b{margin-right:auto}.bar button{background:#fff2;color:#fff;border:1px solid #fff4;border-radius:99px;padding:6px 14px}
.bar button.go{background:var(--pink);border-color:var(--pink)}
.hero{background:linear-gradient(135deg,var(--lav),var(--blush));padding:32px 20px 40px}
.hw{max-width:1000px;margin:auto;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.logo{width:48px;height:48px;flex:none;border-radius:50%;background:#fff;border:2px solid var(--pink);display:grid;place-items:center;overflow:hidden;font:800 24px 'Avenir Next','Trebuchet MS',system-ui,sans-serif;color:var(--pink)}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}.top b{font:800 20px 'Avenir Next','Trebuchet MS',system-ui,sans-serif}
.sr{display:grid;grid-template-columns:116px 1fr 38px;gap:6px}.sr button{border:1px solid var(--line);background:#fff;border-radius:10px;color:#b4143c}.fb .btn{justify-self:start}
.logo img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:clamp(36px,6vw,60px);font-weight:800;color:var(--ink)}
.tag1{font:600 20px 'Avenir Next','Trebuchet MS',system-ui,sans-serif;color:var(--pur);margin:8px 0 12px}
.bio{color:var(--mut);max-width:44ch;white-space:pre-line}
.soc{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.soc a{text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-weight:700;font-size:14px;color:var(--dpur)}
.soc a:hover{background:var(--ink);color:#fff}
.ph{position:relative;justify-self:center;width:min(100%,330px)}
.ph:before{content:"";position:absolute;inset:14px -14px -14px 14px;background:var(--pur);border-radius:170px 170px 24px 24px;opacity:.9}
.ph img{position:relative;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:45% 15%;border-radius:170px 170px 24px 24px;border:4px solid #fff;display:block;background:var(--blush)}
main{max-width:1000px;margin:auto;padding:28px 16px 40px}
.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:99px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:#fff;padding:7px 20px;font-weight:700}
.seg button.on{background:var(--pink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chips button{flex:none;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 16px;color:var(--dpur);font-weight:500}
.chips button.on{background:var(--pur);border-color:var(--pur);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card .im{display:block;aspect-ratio:1;background:var(--lav)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.ct{font-size:12px;font-weight:700;color:var(--pink)}
.cb h3{font-size:18px}.cb p{margin:0;font-size:14px;color:var(--mut);flex:1}
.buy{display:block;text-align:center;text-decoration:none;background:var(--pink);color:#fff;font-weight:700;padding:10px;border-radius:12px;margin-top:6px}
.buy:hover{background:var(--ink)}
.ad{display:flex;gap:6px;margin-top:6px}.ad button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px}
.ad button.del{color:#b4143c}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
footer{background:var(--ink);color:#d9cdf3;text-align:center;padding:28px 20px;font-size:14px}
footer p{max-width:60ch;margin:0 auto 10px}footer button{background:none;border:0;color:#a994d8;text-decoration:underline}
.modal{position:fixed;inset:0;background:#1b1030aa;z-index:50;display:grid;place-items:center;padding:12px}
.sheet{background:#fff;border-radius:20px;padding:20px;width:min(520px,100%);max-height:92vh;overflow:auto}
.sheet h2{margin-bottom:12px}.fb{display:grid;gap:10px}
.fb label{display:grid;gap:4px;font-weight:700;font-size:14px}
.fb input,.fb select,.fb textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;width:100%}
.fb small{color:var(--mut);font-weight:400}.fb img{max-height:90px;border-radius:10px;justify-self:start}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 20px;font-weight:700}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#fff}
@media(max-width:720px){.hw{grid-template-columns:1fr}.ph{order:-1;width:min(70%,260px)}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.cb{padding:10px}.cb h3{font-size:16px}}
</style></head><body><div id="app"></div>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=JSON.parse($('#data').textContent),K='kiva_site_v1',admin=false,cat='all',gen='all',img='';
try{const L=JSON.parse(localStorage.getItem(K)||'null');if(L&&L.ts>(D.ts||0))D=L}catch(e){}
const save=()=>{D.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('Storage is full. Download your site and remove some large images.')}};
const safe=u=>/^https?:\/\//i.test(u)?u:'#';
const ph=p=>{const e={Bags:'👜',Shoes:'👟',Footwear:'👠',Makeup:'💄'}[p.c]||'👗',h=(p.t.length*37)%60+300;return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="hsl(${h},80%,93%)"/><text x="100" y="122" font-size="80" text-anchor="middle">${e}</text></svg>`)};
function shrink(f,max,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};i.src=r.result};r.readAsDataURL(f)}
function render(){
const ps=D.products.filter(p=>(cat==='all'||p.c===cat)&&(gen==='all'||p.g===gen||p.g==='Unisex'));
$('#app').innerHTML=`${admin?`<div class="bar"><b>Owner mode</b><button data-a="add" class="go">+ Add product</button><button data-a="cats">Categories</button><button data-a="prof">Profile</button><button data-a="exp">Download site</button><button data-a="out">Log out</button></div>`:''}
<nav class="top"><div class="logo">${D.logo?`<img src="${esc(D.logo)}" alt="Logo">`:esc(D.brand[0]||'K')}</div><b>${esc(D.brand)}</b></nav>
<header class="hero"><div class="hw"><div>
<h1>${esc(D.brand)}</h1><div class="tag1">${esc(D.tagline)}</div><p class="bio">${esc(D.bio)}</p>
<div class="soc">${D.socials.map(s=>`<a href="${esc(safe(s.u))}" target="_blank" rel="noopener">${esc(s.n)}</a>`).join('')}</div></div>
${D.model?`<div class="ph"><img src="${esc(D.model)}" alt="${esc(D.brand)} model"></div>`:''}</div></header>
<main><div class="filters"><div class="seg" role="group" aria-label="Shop for">${['all','Women','Men'].map(g=>`<button data-a="g" data-v="${g}" class="${gen===g?'on':''}">${g==='all'?'All':g}</button>`).join('')}</div>
<div class="chips">${['all',...D.cats].map(c=>`<button data-a="c" data-v="${esc(c)}" class="${cat===c?'on':''}">${c==='all'?'All products':esc(c)}</button>`).join('')}</div></div>
<div class="grid">${ps.map(p=>`<article class="card"><a class="im" href="${esc(safe(p.u))}" target="_blank" rel="sponsored nofollow noopener"><img loading="lazy" src="${esc(p.i||ph(p))}" alt="${esc(p.t)}"></a>
<div class="cb"><span class="ct">${esc(p.c)}</span><h3>${esc(p.t)}</h3><p>${esc(p.d)}</p><a class="buy" href="${esc(safe(p.u))}" target="_blank" rel="sponsored nofollow noopener">Shop now</a>
${admin?`<div class="ad"><button data-a="edit" data-v="${p.id}">Edit</button><button class="del" data-a="del" data-v="${p.id}">Delete</button></div>`:''}</div></article>`).join('')||`<div class="empty">${admin?'No products here yet. Tap “+ Add product”.':'New picks are coming soon.'}</div>`}</div></main>
<footer><p>Links open on each store’s own website. As an affiliate, I may earn a small commission on purchases, at no extra cost to you.</p><button data-a="in">Owner login</button></footer>`}
function modal(t,body,ok,lab='Save'){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet"><h2>${t}</h2><div class="fb">${body}</div><div class="row"><button class="btn" data-x>Cancel</button><button class="btn pri" data-s>${lab}</button></div></div>`;document.body.appendChild(m);
m.onclick=e=>{if(e.target===m||e.target.hasAttribute('data-x'))m.remove();else if(e.target.hasAttribute('data-s')&&ok(m)!==false)m.remove()};return m}
const F=(l,n,v,t='text')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}"></label>`,V=(m,n)=>m.querySelector(`[name=${n}]`).value.trim();
function pick(m,n,max,prev){m.querySelector(`[name=${n}]`).onchange=e=>{const f=e.target.files[0];if(f)shrink(f,max,u=>{img=u;const p=m.querySelector(prev);p.src=u;p.hidden=false})}}
function prod(p){const n=!p;p=p||{t:'',u:'',c:D.cats[0]||'',g:'Women',d:'',i:''};img=p.i;
const m=modal(n?'Add product':'Edit product',`${F('Product name','t',p.t)}${F('Affiliate link','u',p.u,'url')}
<label>Category<select name="c">${D.cats.map(c=>`<option ${c===p.c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
<label>For<select name="g">${['Women','Men','Unisex'].map(g=>`<option ${g===p.g?'selected':''}>${g}</option>`).join('')}</select></label>
<label>Short description <small>1 to 3 lines</small><textarea name="d" rows="3" maxlength="200">${esc(p.d)}</textarea></label>
<label>Product picture<input name="f" type="file" accept="image/*"></label>${F('Or paste an image link','iu','')}<img id="pv" alt="Preview" ${p.i?`src="${esc(p.i)}"`:'hidden'}>`,m=>{
const t=V(m,'t'),u=V(m,'u');if(!t||!/^https?:\/\//i.test(u)){alert('Add a product name and a link starting with https://');return false}
const o={id:p.id||'p'+Date.now(),t,u,c:V(m,'c'),g:V(m,'g'),d:V(m,'d'),i:img||V(m,'iu')};
if(n)D.products.unshift(o);else D.products[D.products.findIndex(x=>x.id===p.id)]=o;save();render()});pick(m,'f',480,'#pv')}
const PL=['Instagram','Facebook','YouTube','X (Twitter)','Pinterest','WhatsApp','Website'];
const sr=s=>`<div class="sr"><select aria-label="Platform">${[...new Set([...PL,s.n])].map(n=>`<option ${n===s.n?'selected':''}>${esc(n)}</option>`).join('')}</select><input type="url" placeholder="https://..." value="${esc(s.u)}" aria-label="Link"><button type="button" title="Remove" data-rs>✕</button></div>`;
function prof(){let lg=null,md=null;const m=modal('Profile',`${F('Brand name','brand',D.brand)}${F('Tagline','tagline',D.tagline)}<label>Bio<textarea name="bio" rows="3">${esc(D.bio)}</textarea></label>
<label>Company logo<input name="lf" type="file" accept="image/*"></label><img id="lp" alt="Logo" ${D.logo?`src="${esc(D.logo)}"`:'hidden'}><button type="button" class="btn" data-rm="lg">Remove logo</button>
<label>Model photo<input name="mf" type="file" accept="image/*"></label><img id="mp" alt="Model" ${D.model?`src="${esc(D.model)}"`:'hidden'}><button type="button" class="btn" data-rm="md">Remove model photo</button>
<div><b>Social media</b> <small>Links must start with https://</small></div><div id="sl" style="display:grid;gap:6px">${D.socials.map(sr).join('')}</div><button type="button" class="btn" data-add>+ Add platform</button>${F('Owner passcode','pass',D.pass)}`,m=>{
D.brand=V(m,'brand')||D.brand;D.tagline=V(m,'tagline');D.bio=V(m,'bio');D.pass=V(m,'pass')||D.pass;
D.socials=[...m.querySelectorAll('.sr')].map(r=>({n:r.querySelector('select').value,u:r.querySelector('input').value.trim()})).filter(s=>/^https?:\/\//i.test(s.u));
if(lg!==null)D.logo=lg;if(md!==null)D.model=md;save();render()});
m.querySelector('[name=lf]').onchange=e=>e.target.files[0]&&shrink(e.target.files[0],200,u=>{lg=u;const p=m.querySelector('#lp');p.src=u;p.hidden=false});
m.querySelector('[name=mf]').onchange=e=>e.target.files[0]&&shrink(e.target.files[0],700,u=>{md=u;const p=m.querySelector('#mp');p.src=u;p.hidden=false});
m.addEventListener('click',e=>{const t=e.target;if(t.dataset.rm==='lg'){lg='';m.querySelector('#lp').hidden=true}else if(t.dataset.rm==='md'){md='';m.querySelector('#mp').hidden=true}else if('rs' in t.dataset)t.closest('.sr').remove();else if('add' in t.dataset)m.querySelector('#sl').insertAdjacentHTML('beforeend',sr({n:'Instagram',u:''}))})}
function cats(){modal('Categories',`<label>One category per line <small>Add, rename or remove lines. Products in a removed category stay listed under All.</small><textarea name="c" rows="12">${esc(D.cats.join('\n'))}</textarea></label>`,m=>{D.cats=[...new Set(V(m,'c').split('\n').map(s=>s.trim()).filter(Boolean))];if(cat!=='all'&&!D.cats.includes(cat))cat='all';save();render()})}
function exp(){D.ts=Date.now();save();const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelectorAll('.modal').forEach(x=>x.remove());c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'}));a.download='index.html';a.click()}
$('#app').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==='c'){cat=v;render()}else if(a==='g'){gen=v;render()}
else if(a==='in'){const p=prompt('Owner passcode');if(p===D.pass){admin=true;render()}else if(p!==null)alert('Wrong passcode')}
else if(a==='out'){admin=false;render()}else if(a==='add')prod();else if(a==='edit')prod(D.products.find(x=>x.id===v));
else if(a==='del'){if(confirm('Delete this product?')){D.products=D.products.filter(x=>x.id!==v);save();render()}}
else if(a==='prof')prof();else if(a==='cats')cats();else if(a==='exp')exp()};
document.title=D.brand;render();
</script></body></html>
